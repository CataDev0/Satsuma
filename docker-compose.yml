services:
  postgres:
    image: postgres:16
    container_name: satsuma-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: satsuma
      POSTGRES_PASSWORD: changeme
      POSTGRES_DB: satsuma
    ports:
      - "5432:5432"
    volumes:
      - satsuma_pgdata:/var/lib/postgresql/data

volumes:
  satsuma_pgdata:
